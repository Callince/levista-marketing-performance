# Levista reverse proxy: :80 -> Next.js (3000) for the UI, /api -> FastAPI (8000).
# Same origin, so the frontend can use relative /api paths.
server {
    listen 80 default_server;
    server_name 68.183.80.200 _;

    client_max_body_size 50M;          # report uploads can be large

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;       # a rebuild can take a while
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
